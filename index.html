<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac Taskbar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Desktop -->
  <div class="desktop" id="desktop"></div>

  <!-- App Launcher -->
  <div class="launcher" id="launcher">
    <div class="launcher-inner">
      <div class="launcher-search-row">
        <div class="launcher-search-wrap">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="9" cy="9" r="6"/><line x1="15" y1="15" x2="19" y2="19"/></svg>
          <input id="launcherSearch" class="launcher-search" type="text" placeholder="Search" />
        </div>
      </div>
      <div class="launcher-body">
        <!-- Left: All Apps alphabetical -->
        <div class="all-apps-panel" id="allAppsPanel">
          <!-- populated by JS -->
        </div>
        <!-- Right: Recent Apps -->
        <div class="recent-panel">
          <div class="panel-title">Recent Apps</div>
          <div class="recent-list" id="recentList">
            <!-- populated by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dock -->
  <div class="dock-wrap">
    <div class="dock" id="dock">
      <div class="dock-item" data-app="finder" title="Finder">
        <div class="dock-icon">🗂️</div>
        <div class="dock-label">Finder</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="launchpad" id="launchpadBtn" title="Launchpad">
        <div class="dock-icon">🚀</div>
        <div class="dock-label">Launchpad</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="safari" title="Safari">
        <div class="dock-icon">🧭</div>
        <div class="dock-label">Safari</div>
        <div class="dock-dot active"></div>
      </div>
      <div class="dock-item" data-app="mail" title="Mail">
        <div class="dock-icon">✉️</div>
        <div class="dock-label">Mail</div>
        <div class="dock-dot active"></div>
      </div>
      <div class="dock-item" data-app="messages" title="Messages">
        <div class="dock-icon">💬</div>
        <div class="dock-label">Messages</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="calendar" title="Calendar">
        <div class="dock-icon">📅</div>
        <div class="dock-label">Calendar</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="photos" title="Photos">
        <div class="dock-icon">🖼️</div>
        <div class="dock-label">Photos</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="music" title="Music">
        <div class="dock-icon">🎵</div>
        <div class="dock-label">Music</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-item" data-app="claude" title="Claude">
        <div class="dock-icon">🤖</div>
        <div class="dock-label">Claude</div>
        <div class="dock-dot active"></div>
      </div>
      <div class="dock-item" data-app="excel" title="Microsoft Excel">
        <div class="dock-icon">📊</div>
        <div class="dock-label">Excel</div>
        <div class="dock-dot active"></div>
      </div>
      <div class="dock-item" data-app="chrome" title="Google Chrome">
        <div class="dock-icon">🌐</div>
        <div class="dock-label">Chrome</div>
        <div class="dock-dot"></div>
      </div>
      <div class="dock-item" data-app="trash" title="Trash">
        <div class="dock-icon">🗑️</div>
        <div class="dock-label">Trash</div>
        <div class="dock-dot"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
